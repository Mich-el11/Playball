<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040b1c" />
    <meta name="description" content="Playball — an original arcade football game." />
    <title>Playball</title>
    <link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-box">
          <img src="/assets/app-icon.svg" alt="" class="brand-icon" />
          <div>
            <p class="eyebrow">ORIGINAL FOOTBALL</p>
            <h1>PLAYBALL</h1>
          </div>
        </div>
        <div class="score-panel" aria-label="Match score">
          <span id="homeScore">0</span><span class="divider">:</span><span id="awayScore">0</span>
        </div>
      </header>

      <main class="game-wrap">
        <canvas id="gameCanvas" width="960" height="540" aria-label="Playball football match. Blue team attacks to the right."></canvas>
        <div class="mobile-controls" aria-label="Touch controls">
          <div class="dpad" aria-label="Move player">
            <button type="button" data-key="w" aria-label="Move up">▲</button>
            <button type="button" data-key="a" aria-label="Move left">◀</button>
            <button type="button" data-key="s" aria-label="Move down">▼</button>
            <button type="button" data-key="d" aria-label="Move right">▶</button>
          </div>
          <button type="button" class="shoot-button" id="shootButton">SHOOT</button>
        </div>
      </main>

      <footer class="hud">
        <div class="stats">
          <span>TIME <strong id="timer">90:00</strong></span>
          <span>YOU <strong>BLUE</strong></span>
        </div>
        <div class="controls">
          <span>Move: WASD / arrows</span>
          <span>Shoot: Space</span>
          <button type="button" id="restartButton" class="restart-button">Restart match</button>
        </div>
      </footer>
      <p class="game-message" id="gameMessage" aria-live="polite"></p>
    </div>
    <script type="module" src="/src/game.js"></script>
  </body>
</html>
